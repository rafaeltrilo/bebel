<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página não encontrada — Roteiro do Seu Jeito</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#f8f4ee; --ink:#12263f; --muted:#5b6b7d; --coral:#F26B4F; --navy:#12355B; color-scheme:light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1726; --ink:#e8eef6; --muted:#9db0c6; --coral:#f08a6f; --navy:#9cc3e6; color-scheme:dark; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--ink); font:17px/1.55 "Segoe UI",system-ui,sans-serif; text-align:center; }
  .box { max-width:34em; display:grid; gap:18px; justify-items:center; }
  h1 { margin:0; font-size:clamp(1.8rem,5vw,2.6rem); letter-spacing:-.02em; }
  p { margin:0; color:var(--muted); }
  .code { font-family:ui-monospace,Consolas,monospace; letter-spacing:.14em; font-size:.8rem; color:var(--coral); text-transform:uppercase; }
  a { display:inline-flex; background:var(--coral); color:#fff; font-weight:700; padding:14px 26px;
      border-radius:999px; text-decoration:none; }
  a:focus-visible { outline:3px solid var(--navy); outline-offset:3px; }
</style>
</head>
<body>
  <div class="box">
    <span class="code">Erro 404</span>
    <h1>Essa página saiu do roteiro</h1>
    <p>O endereço que você abriu não existe (ou mudou de lugar). Volte para a página inicial e siga os números.</p>
    <a href="/">Ir para a página inicial</a>
  </div>
</body>
</html>
